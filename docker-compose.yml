services:
  firewall-automation:
    build:
      context: .
      dockerfile: Dockerfile

    image: my-automation-app
    container_name: firewall_automation_container

    ports:
      - "5555:5555"

    environment:
      # Listen on all addresses inside the container (needed for Docker)
      - HOST=0.0.0.0
      - PORT=5555

      # All app data is saved in /app/data (see "volumes" below)
      - DATA_DIR=/app/data

    volumes:
      # One folder for all app data:
      #   users.json, firewalls.json, audit.log,
      #   .firewall.key (encrypts firewall passwords), .secret_key
      # Back up this folder!
      - ./data:/app/data:rw

    restart: unless-stopped
